<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mô Phỏng 3D: Nhà, Cơ Thể & Đời Sống</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #090d16; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
        }
        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(15, 23, 42, 0.85);
            padding: 20px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1);
            color: #ffffff;
            width: 300px;
        }
        h2 { margin: 0 0 6px 0; font-size: 17px; font-weight: 600; color: #38bdf8; }
        p { margin: 0 0 15px 0; font-size: 12px; color: #94a3b8; line-height: 1.4; }
        
        .section-title { font-size: 13px; font-weight: 600; color: #cbd5e1; margin-bottom: 8px; margin-top: 12px; }
        
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }
        .theme-btn {
            background: #1e293b;
            color: #e2e8f0;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }
        .theme-btn:hover { background: #334155; border-color: #38bdf8; color: #fff; }
        
        .file-upload-btn {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: white;
            padding: 9px 12px;
            border-radius: 8px;
            text-align: center;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
        }
        .file-upload-btn:hover { opacity: 0.9; transform: translateY(-1px); }
        #imageLoader { display: none; }
        
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.5);
            font-size: 12px;
            pointer-events: none;
            letter-spacing: 0.5px;
            background: rgba(0,0,0,0.4);
            padding: 6px 14px;
            border-radius: 20px;
        }
    </style>
</head>
<body>

    <div id="ui-container">
        <h2>Mô Phỏng 3D Đa Chiều</h2>
        <p>Khám phá sự kết nối giữa không gian sống, sinh học và vật dụng.</p>
        
        <div class="section-title">Chọn Chủ Đề Mô Phỏng:</div>
        <div class="btn-grid">
            <button class="theme-btn" onclick="setTheme('house')">🏠 Ngôi Nhà</button>
            <button class="theme-btn" onclick="setTheme('body')">🫀 Cơ Thể Người</button>
            <button class="theme-btn" onclick="setTheme('food')">🍎 Đồ Ăn / Dinh Dưỡng</button>
            <button class="theme-btn" onclick="setTheme('tools')">⚙️ Vật Dụng</button>
        </div>

        <div class="section-title">Hoặc Tùy Chỉnh Riêng:</div>
        <label for="imageLoader" class="file-upload-btn">📁 Tải Ảnh 2D Thành 3D</label>
        <input type="file" id="imageLoader" accept="image/*">
    </div>

    <div id="instructions">Giữ và kéo chuột để xoay mô hình 360 độ</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
